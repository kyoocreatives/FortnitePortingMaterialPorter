name: Build Commit

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Fetch Submodules Recursively
        run: git submodule update --init --recursive

      # Material Porter fork: the fixes it carries for FP's CUE4Parse (whole files, laid over the submodule)
      - name: Apply CUE4Parse Overlay
        run: Copy-Item -Path ./patches/CUE4Parse/* -Destination ./external/CUE4Parse -Recurse -Force

      - name: .NET 10 Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore ./src/FortnitePorting
      
      - name: Get Version
        shell: bash
        run: echo "FP_VERSION=$(sed -n 's:.*<Version>\([0-9.]*\)-dev</Version>.*:\1:p' src/FortnitePorting/FortnitePorting.csproj)-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: .NET Publish
        run: |
          dotnet publish ./src/FortnitePorting -c Release --self-contained -r win-x64 -o "./Release" `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ env.FP_VERSION }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortnitePorting-${{ github.sha }}
          path: ./Release/FortnitePorting.exe
          retention-days: 30