name: Build Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      # Material Porter fork: its releases (v4.3.4-mp.1.13.0, ...); "-mp." keeps FP's updater, which would install
      # upstream FP over the fork, off. v4.3.4-mp.154-1.13.0 also prompts apps from before this numbering.
      - 'v*-mp.*'

jobs:
  build:
    runs-on: windows-latest
    # Material Porter fork: creates the release (a fork's token is read-only by default)
    permissions:
      contents: write

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Fetch Submodules Recursively
        run: git submodule update --init --recursive

      # Material Porter fork: the fixes it carries for FP's CUE4Parse (whole files, laid over the submodule)
      - name: Apply CUE4Parse Overlay
        run: Copy-Item -Path ./patches/CUE4Parse/* -Destination ./external/CUE4Parse -Recurse -Force

      - name: .NET 10 Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore ./src/FortnitePorting

      - name: Get Version
        shell: bash
        run: |
          VERSION=$(echo '${{ github.ref_name }}' | sed -E 's/^v//; s/-mp\.[0-9]+-/-mp./')
          UPSTREAM=$(sed -n 's:.*<Version>\([0-9.]*\)-dev</Version>.*:\1:p' src/FortnitePorting/FortnitePorting.csproj)
          [ "${VERSION%%-*}" = "$UPSTREAM" ] || { echo "tag says FP ${VERSION%%-*}, the csproj says $UPSTREAM"; exit 1; }
          echo "FP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "MP_DISPLAY=fpv-${VERSION%%-*}/mpv-${VERSION#*-mp.}" >> $GITHUB_ENV

      - name: .NET Publish
        run: |
          dotnet publish ./src/FortnitePorting -c Release --self-contained -r win-x64 -o "./Release" `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ env.FP_VERSION }}

      - name: Name Executable
        run: Rename-Item ./Release/FortnitePorting.exe FortnitePortingMP.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FortnitePorting MP ${{ env.MP_DISPLAY }}"
          files: ./Release/FortnitePortingMP.exe
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
